name: Daily app and game radar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-app-game-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: radar-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            radar-db-${{ runner.os }}-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python -m app_radar --config config.json

      - name: Prepare Pages site
        run: cp reports/latest.html reports/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potential-radar-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  deploy-and-notify:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: potential-radar-${{ github.run_id }}
          path: reports/

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Lark
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: python -m app_radar.lark --report reports/latest.json --url "${{ steps.deployment.outputs.page_url }}"
