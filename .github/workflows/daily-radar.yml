name: Daily app and game radar

on:
  schedule:
    # 08:17 Asia/Shanghai. Changing the minute also refreshes GitHub's scheduler registration.
    - cron: "17 0 * * *"
    # 10:17 Asia/Shanghai fallback. The preflight job skips it when today's report already succeeded.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore today's successful run and generate again"
        required: false
        default: true
        type: boolean
      resend:
        description: "Only resend today's published report to Lark (no rebuild or deployment)"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-app-game-radar
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.dedupe.outputs.should_run }}
    steps:
      - name: Skip duplicate scheduled run
        id: dedupe
        uses: actions/github-script@v7
        with:
          script: |
            if (
              context.eventName === "workflow_dispatch"
              && String(context.payload?.inputs?.resend).toLowerCase() === "true"
            ) {
              core.info("Notification-only resend requested; skipping report generation.");
              core.setOutput("should_run", "false");
              return;
            }
            const externalDedupe =
              context.eventName === "workflow_dispatch"
              && String(context.payload?.inputs?.force).toLowerCase() === "false"
              && String(context.payload?.inputs?.resend).toLowerCase() !== "true";
            if (context.eventName !== "schedule" && !externalDedupe) {
              core.info("Forced manual dispatch always runs.");
              core.setOutput("should_run", "true");
              return;
            }

            try {
              const formatter = new Intl.DateTimeFormat("en-US", {
                timeZone: "Asia/Shanghai",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              });
              const parts = Object.fromEntries(
                formatter.formatToParts(new Date()).map(({ type, value }) => [type, value]),
              );
              const localDate = `${parts.year}-${parts.month}-${parts.day}`;
              const dayStart = new Date(`${localDate}T00:00:00+08:00`);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "daily-radar.yml",
                status: "success",
                per_page: 100,
              });
              const successfulRun = data.workflow_runs.find(
                (run) => run.id !== context.runId && new Date(run.created_at) >= dayStart,
              );

              if (successfulRun) {
                core.info(`Skipping: run ${successfulRun.id} already succeeded on ${localDate}.`);
                core.setOutput("should_run", "false");
                await core.summary
                  .addHeading("Daily radar already completed")
                  .addLink(`Successful run ${successfulRun.id}`, successfulRun.html_url)
                  .write();
                return;
              }

              core.info(`No successful run found for ${localDate}; continuing.`);
              core.setOutput("should_run", "true");
            } catch (error) {
              core.warning(`Could not check today's runs; continuing to avoid a missed report: ${error.message}`);
              core.setOutput("should_run", "true");
            }

  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: radar-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            radar-db-${{ runner.os }}-

      - name: Restore report archive
        uses: actions/cache@v4
        with:
          path: reports/archive
          key: report-archive-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            report-archive-${{ runner.os }}-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate report
        run: python -m app_radar --config config.json

      - name: Prepare Pages site
        run: cp reports/latest.html reports/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potential-radar-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload radar state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-state-${{ github.run_id }}
          path: data/radar.db
          retention-days: 30
          if-no-files-found: warn

  deploy-and-notify:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore notification state
        uses: actions/cache@v4
        with:
          path: data/lark-state.json
          key: lark-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lark-state-${{ runner.os }}-

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: potential-radar-${{ github.run_id }}
          path: reports/

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Lark
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: python -m app_radar.lark --report reports/latest.json --url "${{ steps.deployment.outputs.page_url }}"

  resend-notification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.resend }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find today's published report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const parts = Object.fromEntries(
              new Intl.DateTimeFormat("en-US", {
                timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
              }).formatToParts(new Date()).map(({ type, value }) => [type, value]),
            );
            const day = `${parts.year}-${parts.month}-${parts.day}`;
            const start = new Date(`${day}T00:00:00+08:00`);
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "daily-radar.yml", branch: "main", status: "success", per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (new Date(run.created_at) < start) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100,
              });
              const report = artifacts.find(item =>
                item.name === `potential-radar-${run.id}` && !item.expired,
              );
              if (!report) continue;
              core.setOutput("run_id", String(run.id));
              core.setOutput("artifact_name", report.name);
              core.info(`Resending published report from ${run.html_url} for ${day}`);
              return;
            }
            throw new Error(`No published report artifact found for ${day}; generate the daily report first.`);

      - name: Download today's report
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.report.outputs.artifact_name }}
          run-id: ${{ steps.report.outputs.run_id }}
          github-token: ${{ github.token }}
          path: reports/

      - name: Resend today's Lark notification
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open("reports/latest.json", encoding="utf-8") as report:
              payload = json.load(report)
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          if str(payload.get("generated_at", ""))[:10] != today:
              raise SystemExit("Refusing to resend a report from a different date")
          PY
          python -m app_radar.lark --report reports/latest.json --url "https://mjy0808.github.io/RankNest/" --force

  notify-failure:
    runs-on: ubuntu-latest
    needs: [preflight, build, deploy-and-notify]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.build.result == 'failure' || needs.deploy-and-notify.result == 'failure') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notify Lark about workflow failure
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          FAILURE_DETAIL: preflight=${{ needs.preflight.result }}, build=${{ needs.build.result }}, deploy-and-notify=${{ needs.deploy-and-notify.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m app_radar.lark --failure --detail "$FAILURE_DETAIL" --url "$WORKFLOW_URL"
